name: GUING Generated Package CI

on:
  pull_request:
    paths:
      - 'guing-generated/**'

jobs:
  validate-generated-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck generated package scaffold
        run: pnpm exec tsc -p guing-generated/tsconfig.json --noEmit
      - name: Validate generated package metadata
        run: node -e "const p=require('./guing-generated/package.json'); if(!p.name) throw new Error('Missing package name')"